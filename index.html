<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le.Find - Comparador de Preços Global</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0F172A;
            color: #F8FAFC;
            margin: 0;
            padding: 20px;
        }
        .lefind-container {
            max-width: 1000px;
            margin: 0 auto;
            text-align: center;
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 5px;
            color: #60A5FA;
        }
        p.subtitle {
            color: #94A3B8;
            margin-bottom: 25px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }
        .search-input {
            width: 70%;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid #334155;
            background-color: #1E293B;
            color: #FFFFFF;
            font-size: 1rem;
            outline: none;
        }
        .search-input:focus {
            border-color: #3B82F6;
        }
        .search-btn {
            background-color: #3B82F6;
            color: #FFFFFF;
            border: none;
            padding: 0 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .search-btn:hover {
            background-color: #2563EB;
        }
        .lefind-filters {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .filter-btn {
            background-color: #1E293B;
            color: #CBD5E1;
            border: 1px solid #334155;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }
        .filter-btn.active, .filter-btn:hover {
            background-color: #3B82F6;
            color: #FFFFFF;
            border-color: #60A5FA;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            text-align: left;
        }
        .product-card {
            background-color: #1E293B;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .product-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #F1F5F9;
        }
        .price-range {
            font-size: 1.1rem;
            font-weight: 700;
            color: #34D399;
            margin-bottom: 8px;
        }
        .brand-info {
            font-size: 0.85rem;
            color: #94A3B8;
            margin-bottom: 12px;
        }
        .product-tag {
            display: inline-block;
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 600;
            margin-bottom: 10px;
            width: fit-content;
        }
        .tag-new { background-color: #065F46; color: #34D399; }
        .tag-used { background-color: #78350F; color: #FBBF24; }
        .tag-multi { background-color: #1E3A8A; color: #93C5FD; }
        
        .buy-btn {
            background-color: #2563EB;
            color: #FFFFFF;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .buy-btn:hover { background-color: #1D4ED8; }
    </style>
</head>
<body>

    <div class="lefind-container">
        <h1>Le.Find</h1>
        <p class="subtitle">Agregador Global: Compare faixas de preço e marcas em todas as lojas instantaneamente.</p>

        <!-- BARRA DE PESQUISA -->
        <div class="search-box">
            <input type="text" id="searchInput" class="search-input" placeholder="O que deseja procurar? (Ex: Air Fryer, iPhone, Tênis...)">
            <button class="search-btn" onclick="executarBuscaGlobal()">Buscar em Tudo</button>
        </div>

        <!-- FILTROS HÍBRIDOS -->
        <div class="lefind-filters">
            <button class="filter-btn active" onclick="filtrarCondicao('all', this)">🔍 Todos</button>
            <button class="filter-btn" onclick="filtrarCondicao('new', this)">✨ Lojas Oficiais (Novos)</button>
            <button class="filter-btn" onclick="filtrarCondicao('used', this)">♻️ Garimpo (Usados)</button>
        </div>

        <!-- GRELHA DE RESULTADOS -->
        <div id="productsGrid" class="products-grid"></div>
    </div>

    <script>
        const listaProdutos = [
            { title: "Smartphone Apple iPhone 15 Pro Max 256GB", price: "R$ 6.899,00", condition: "new", store: "Amazon / Mercado Livre", tagClass: "tag-new", url: "https://www.mercadolivre.com.br" },
            { title: "Tênis Nike Air Force 1 Original Seminovo", price: "R$ 280,00", condition: "used", store: "Garimpo Local / OLX", tagClass: "tag-used", url: "https://www.olx.com.br" },
            { title: "Cadeira de Escritório Presidente Ergonômica", price: "R$ 749,90", condition: "new", store: "Shopee / Lomadee", tagClass: "tag-new", url: "https://www.shopee.com.br" },
            { title: "Console PlayStation 5 Com 2 Controles", price: "R$ 3.200,00", condition: "used", store: "Enjoei / Usados", tagClass: "tag-used", url: "https://www.enjoei.com.br" },
            { title: "Smart TV 50 4K UHD LED Wi-Fi", price: "R$ 2.199,00", condition: "new", store: "AliExpress / Awin", tagClass: "tag-new", url: "https://pt.aliexpress.com" }
        ];

        let filtroCondicaoAtual = 'all';

        function renderizarInicial(produtosParaMostrar) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';

            const filtrados = produtosParaMostrar.filter(p => {
                if (filtroCondicaoAtual === 'all') return true;
                return p.condition === filtroCondicaoAtual;
            });

            filtrados.forEach(produto => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div>
                        <span class="product-tag ${produto.tagClass}">{produto.store}</span>
                        <div class="product-title">${produto.title}</div>
                        <div class="price-range">${produto.price}</div>
                        <div class="brand-info">Plataforma Destaque</div>
                    </div>
                    <a href="${produto.url}" target="_blank" class="buy-btn">Ver na Loja</a>
                `;
                grid.appendChild(card);
            });
        }

        function executarBuscaGlobal() {
            const termo = document.getElementById('searchInput').value.trim();
            if (!termo) {
                renderizarInicial(listaProdutos);
                return;
            }

            const termoCodificado = encodeURIComponent(termo);

            // Simulação inteligente de faixa de preço e marcas por plataforma para dar a média imediata ao usuário
            const resultadosDinamicos = [
                { 
                    store: "Amazon (Afiliados)", tagClass: "tag-new", condition: "new",
                    price: "R$ 189,00 – R$ 549,00", brand: "Ex: Mondial, Philips Walita",
                    url: `https://www.amazon.com.br/s?k=${termoCodificado}` 
                },
                { 
                    store: "Mercado Livre", tagClass: "tag-new", condition: "new",
                    price: "R$ 150,00 – R$ 499,00", brand: "Ex: Britânia, Arno, Midea",
                    url: `https://lista.mercadolivre.com.br/${termoCodificado}` 
                },
                { 
                    store: "Shopee / Lomadee", tagClass: "tag-new", condition: "new",
                    price: "R$ 119,00 – R$ 380,00", brand: "Ex: Lenoxx, Mondial, genéricas",
                    url: `https://shopee.com.br/search?keyword=${termoCodificado}` 
                },
                { 
                    store: "AliExpress / Awin", tagClass: "tag-new", condition: "new",
                    price: "R$ 99,00 – R$ 320,00", brand: "Ex: Xiaomi, importados diretos",
                    url: `https://pt.aliexpress.com/wholesale?SearchText=${termoCodificado}` 
                },
                { 
                    store: "OLX / Enjoei (Usados)", tagClass: "tag-used", condition: "used",
                    price: "R$ 70,00 – R$ 220,00", brand: "Ex: Seminovos bem conservados",
                    url: `https://www.olx.com.br/brasil?q=${termoCodificado}` 
                },
                { 
                    store: "eBay / Impact", tagClass: "tag-multi", condition: "new",
                    price: "R$ 250,00 – R$ 890,00", brand: "Ex: Marcas internacionais",
                    url: `https://www.ebay.com/sch/i.html?_nkw=${termoCodificado}` 
                }
            ];

            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';

            const filtrados = resultadosDinamicos.filter(p => {
                if (filtroCondicaoAtual === 'all') return true;
                return p.condition === filtroCondicaoAtual;
            });

            filtrados.forEach(produto => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div>
                        <span class="product-tag ${produto.tagClass}">${produto.store}</span>
                        <div class="product-title">${termo.toUpperCase()}</div>
                        <div class="price-range">${produto.price}</div>
                        <div class="brand-info">💡 ${produto.brand}</div>
                    </div>
                    <a href="${produto.url}" target="_blank" class="buy-btn">Ver Ofertas na Loja</a>
                `;
                grid.appendChild(card);
            });
        }

        function filtrarCondicao(tipo, elemento) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            elemento.classList.add('active');
            filtroCondicaoAtual = tipo;
            
            const termo = document.getElementById('searchInput').value.trim();
            if (termo) {
                executarBuscaGlobal();
            } else {
                renderizarInicial(listaProdutos);
            }
        }

        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                executarBuscaGlobal();
            }
        });

        window.onload = () => {
            renderizarInicial(listaProdutos);
        };
    </script>
</body>
</html>
