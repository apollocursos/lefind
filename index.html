<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LE.FIND - Agregador Global de Ofertas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: #111827;
            --card-border: #1f2937;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-yellow: #f59e0b;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .main-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            padding: 30px 20px 20px 20px;
            background-color: transparent;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            text-align: center;
        }

        .brand-title {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--accent-blue);
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            justify-content: center;
            width: 100%;
            max-width: 650px;
        }

        .search-input-wrapper {
            position: relative;
            flex-grow: 1;
            display: flex;
            align-items: center;
        }

        .search-input {
            width: 100%;
            padding: 12px 45px 12px 18px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            background-color: var(--card-bg);
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent-blue);
        }

        .camera-btn {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.1rem;
            transition: color 0.2s;
        }

        .camera-btn:hover {
            color: var(--accent-blue);
        }

        .search-btn {
            background-color: var(--accent-blue);
            color: #FFFFFF;
            border: none;
            padding: 0 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .search-btn:hover {
            background-color: #2563eb;
        }

        .trends-bar, .history-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .trends-title, .history-title {
            color: var(--text-muted);
            font-weight: 600;
        }

        .trend-chips, .history-chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .chip {
            background-color: var(--card-bg);
            color: var(--text-main);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid var(--card-border);
        }

        .chip:hover {
            background-color: var(--accent-blue);
            border-color: var(--accent-blue);
        }

        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1160px;
            padding: 0 20px;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 10px;
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .filter-btn:hover, .filter-btn.active {
            border-color: var(--accent-blue);
            background-color: rgba(59, 130, 246, 0.1);
        }

        .sort-select {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 8px 14px;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .stats-banner {
            margin: 15px 20px 10px 20px;
            background-color: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 12px 20px;
            border-radius: 10px;
            text-align: center;
            font-size: 0.95rem;
            color: #93c5fd;
        }

        .results-grid {
            padding: 10px 20px 40px 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
        }

        .offer-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
            transition: transform 0.2s, border-color 0.2s;
        }

        .offer-card:hover {
            border-color: var(--text-muted);
            transform: translateY(-2px);
        }

        .offer-card.best-deal {
            border-color: var(--accent-green);
        }

        .best-badge {
            position: absolute;
            top: -10px;
            left: 20px;
            background-color: var(--accent-green);
            color: #000;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 3px 10px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .price-tag {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--text-main);
        }

        .card-tags {
            display: flex;
            gap: 8px;
            font-size: 0.8rem;
        }

        .tag-frete {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--accent-green);
            padding: 3px 8px;
            border-radius: 4px;
        }

        .tag-rating {
            background-color: rgba(245, 158, 11, 0.1);
            color: var(--accent-yellow);
            padding: 3px 8px;
            border-radius: 4px;
        }

        .platform-info {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .history-box {
            background-color: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }

        .trend-down {
            color: var(--accent-green);
            font-weight: 500;
        }

        .card-actions {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        .btn-offer {
            flex-grow: 2;
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            transition: background 0.2s;
        }

        .btn-offer:hover {
            background-color: #2563eb;
        }

        .btn-alert {
            flex-grow: 1;
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-alert:hover {
            background-color: var(--card-border);
        }

        /* MODAL DE ALERTA */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-main);
        }

        .modal-input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background-color: var(--bg-dark);
            color: var(--text-main);
            outline: none;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 10px;
        }

        .btn-cancel {
            background: transparent;
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-save {
            background-color: var(--accent-blue);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <header>
            <div class="brand-title">
                <i class="fa-solid fa-cube"></i> LE.FIND
            </div>
            
            <div class="search-box">
                <div class="search-input-wrapper">
                    <input type="text" id="searchInput" class="search-input" placeholder="O que deseja procurar ou tirar foto?">
                    <button class="camera-btn" onclick="ativarCamera()" title="Pesquisar por Foto"><i class="fa-solid fa-camera"></i></button>
                </div>
                <button class="search-btn" onclick="executarBusca()">Buscar</button>
            </div>

            <input type="file" id="fileInput" accept="image/*" capture="environment" style="display: none;" onchange="processarFoto(event)">

            <div class="trends-bar">
                <span class="trends-title">Tendências:</span>
                <div class="trend-chips">
                    <button class="chip" onclick="buscarTermo('Chupeta Infantil')">Chupeta Infantil</button>
                    <button class="chip" onclick="buscarTermo('Air Fryer')">Air Fryer</button>
                    <button class="chip" onclick="buscarTermo('Xbox Series X')">Xbox Series X</button>
                    <button class="chip" onclick="buscarTermo('iPhone 15')">iPhone 15</button>
                </div>
            </div>

            <!-- HISTÓRICO DE PESQUISAS DO USUÁRIO -->
            <div class="history-bar" id="historyBar" style="display: none;">
                <span class="history-title">Suas Buscas:</span>
                <div class="history-chips" id="historyChips"></div>
            </div>
        </header>

        <div class="controls-row">
            <div class="filter-buttons">
                <button class="filter-btn active" onclick="filtrar('todos', event)"><i class="fa-solid fa-globe"></i> Todos</button>
                <button class="filter-btn" onclick="filtrar('oficiais', event)"><i class="fa-solid fa-shield-halved"></i> Lojas Oficiais (Novos)</button>
                <button class="filter-btn" onclick="filtrar('garimpo', event)"><i class="fa-solid fa-tags"></i> Garimpo (Usados)</button>
            </div>
            <select class="sort-select" id="sortSelect" onchange="mudarOrdenacao()">
                <option value="relevancia">Ordenar por: Relevância</option>
                <option value="menor-preco">Menor Preço Global</option>
                <option value="maior-preco">Maior Preço Global</option>
            </select>
        </div>

        <div class="stats-banner" id="stats-banner">
            Encontradas 6 lojas. Comparando as melhores ofertas em tempo real.
        </div>

        <div class="results-grid" id="results-grid"></div>
    </div>

    <!-- MODAL DE ALERTA DE PREÇO -->
    <div class="modal-overlay" id="alertModal">
        <div class="modal-content">
            <div class="modal-title"><i class="fa-regular fa-bell"></i> Criar Alerta de Preço</div>
            <p style="font-size: 0.9rem; color: var(--text-muted);">Avise-me quando o preço baixar para este item:</p>
            <input type="email" id="alertEmail" class="modal-input" placeholder="Seu e-mail ou WhatsApp">
            <div class="modal-actions">
                <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
                <button class="btn-save" onclick="salvarAlerta()">Ativar Alerta</button>
            </div>
        </div>
    </div>

    <script>
        let termoAtual = "Xbox Series X";
        let filtroAtual = "todos";
        let historicoBuscas = JSON.parse(localStorage.getItem('lefind_history')) || [];

        function normalizarTexto(texto) {
            return texto.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        }

        function gerarPrecosDinamicos(termo) {
            const termoLower = normalizarTexto(termo);
            let baseMin = 150;
            let baseMax = 550;

            if (termoLower.includes('xbox series x') || termoLower.includes('xbox')) {
                baseMin = 3499.00; baseMax = 3899.00;
            } else if (termoLower.includes('chupeta')) {
                baseMin = 7.99; baseMax = 19.99;
            } else if (termoLower.includes('air fryer')) {
                baseMin = 299.00; baseMax = 599.00;
            } else if (termoLower.includes('iphone')) {
                baseMin = 4500.00; baseMax = 7800.00;
            } else {
                baseMin = 120.00; baseMax = 650.00;
            }

            return [
                { store: "Shopee / Lomadee", condition: "new", min: baseMin * 0.95, max: baseMax * 0.95, brand: "Ofertas Diretas", frete: "📦 Frete Grátis", rating: "⭐ 4.9 (4.1k)", best: true },
                { store: "Amazon (Afiliados)", condition: "new", min: baseMin, max: baseMax, brand: "Lojas Oficiais", frete: "📦 Frete Prime", rating: "⭐ 4.8 (2.3k)", best: false },
                { store: "Mercado Livre", condition: "new", min: baseMin * 1.02, max: baseMax * 1.05, brand: "Nacionais & Importadas", frete: "📦 Frete Full", rating: "⭐ 4.7 (1.8k)", best: false },
                { store: "AliExpress / Awin", condition: "new", min: baseMin * 0.90, max: baseMax * 0.90, brand: "Direto da Fábrica", frete: "✈ Envio Internacional", rating: "⭐ 4.6 (950)", best: false },
                { store: "OLX / Enjoei", condition: "used", min: baseMin * 0.60, max: baseMax * 0.70, brand: "Garimpo e Seminovos", frete: "📍 Combinar com Vendedor", rating: "⭐ 4.5 (310)", best: false },
                { store: "eBay / Impact", condition: "new", min: baseMin * 1.10, max: baseMax * 1.15, brand: "Importados Globais", frete: "📦 Envio Global", rating: "⭐ 4.8 (620)", best: false }
            ];
        }

        function atualizarHistorico(termo) {
            if (!historicoBuscas.includes(termo)) {
                historicoBuscas.unshift(termo);
                if (historicoBuscas.length > 5) historicoBuscas.pop();
                localStorage.setItem('lefind_history', JSON.stringify(historicoBuscas));
            }
            renderizarHistoricoUI();
        }

        function renderizarHistoricoUI() {
            const bar = document.getElementById('historyBar');
            const chipsContainer = document.getElementById('historyChips');
            chipsContainer.innerHTML = '';

            if (historicoBuscas.length > 0) {
                bar.style.display = 'flex';
                historicoBuscas.forEach(t => {
                    const btn = document.createElement('button');
                    btn.className = 'chip';
                    btn.innerText = t;
                    btn.onclick = () => buscarTermo(t);
                    chipsContainer.appendChild(btn);
                });
            } else {
                bar.style.display = 'none';
            }
        }

        function renderizarOfertas(termo, filtroTipo = 'todos') {
            termoAtual = termo;
            filtroTipo = filtroAtual;
            let ofertas = gerarPrecosDinamicos(termo);

            if (filtroTipo === 'oficiais') {
                ofertas = ofertas.filter(o => o.brand === "Lojas Oficiais" || o.brand === "Ofertas Diretas");
            } else if (filtroTipo === 'garimpo') {
                ofertas = ofertas.filter(o => o.condition === "used");
            }

            const sortVal = document.getElementById('sortSelect').value;
            if (sortVal === 'menor-preco') {
                ofertas.sort((a, b) => a.min - b.min);
            } else if (sortVal === 'maior-preco') {
                ofertas.sort((a, b) => b.min - a.min);
            }

            const grid = document.getElementById('results-grid');
            grid.innerHTML = '';

            ofertas.forEach(item => {
                const card = document.createElement('div');
                card.className = `offer-card ${item.best ? 'best-deal' : ''}`;
                let badgeHtml = item.best ? `<div class="best-badge"><i class="fa-solid fa-star"></i> Menor Preço Global</div>` : '';
                const precoFormatado = `R$ ${item.min.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2})} - R$ ${item.max.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;

                card.innerHTML = `
                    ${badgeHtml}
                    <div class="card-header">
                        <div class="card-title">${termo.toUpperCase()} (${item.brand})</div>
                    </div>
                    <div class="price-tag">${precoFormatado}</div>
                    <div class="card-tags">
                        <span class="tag-frete">${item.frete}</span>
                        <span class="tag-rating">${item.rating}</span>
                    </div>
                    <div class="platform-info">Plataforma: ${item.store}</div>
                    <div class="history-box">
                        <span>Histórico (30d): Tendência</span>
                        <span class="trend-down"><i class="fa-solid fa-arrow-trend-down"></i> Em Queda ↓</span>
                    </div>
                    <div class="card-actions">
                        <a href="#" class="btn-offer">Ver Ofertas</a>
                        <button class="btn-alert" onclick="abrirModal()"><i class="fa-regular fa-bell"></i> Alerta</button>
                    </div>
                `;
                grid.appendChild(card);
            });

            document.getElementById('stats-banner').innerText = `Encontradas ${ofertas.length} lojas para "${termo}". Comparando as melhores ofertas em tempo real.`;
        }

        function buscarTermo(termo) {
            document.getElementById('searchInput').value = termo;
            atualizarHistorico(termo);
            renderizarOfertas(termo);
        }

        function executarBusca() {
            const input = document.getElementById('searchInput').value.trim();
            if (input) {
                atualizarHistorico(input);
                renderizarOfertas(input);
            }
        }

        function ativarCamera() {
            document.getElementById('fileInput').click();
        }

        function processarFoto(event) {
            const file = event.target.files[0];
            if (file) {
                const termoFoto = "Air Fryer";
                document.getElementById('searchInput').value = termoFoto;
                atualizarHistorico(termoFoto);
                renderizarOfertas(termoFoto);
                document.getElementById('stats-banner').innerText = `📸 Imagem reconhecida com sucesso! Produto identificado: "${termoFoto}". Mostrando ofertas globais.`;
            }
        }

        function filtrar(tipo, e) {
            filtroAtual = tipo;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            if(e) e.currentTarget.classList.add('active');
            renderizarOfertas(termoAtual);
        }

        function mudarOrdenacao() {
            renderizarOfertas(termoAtual);
        }

        function abrirModal() {
            document.getElementById('alertModal').style.display = 'flex';
        }

        function fecharModal() {
            document.getElementById('alertModal').style.display = 'none';
        }

        function salvarAlerta() {
            const email = document.getElementById('alertEmail').value;
            if (email) {
                alert('Alerta configurado com sucesso! Avisaremos em breve.');
                document.getElementById('alertEmail').value = '';
                fecharModal();
            } else {
                alert('Por favor, digite um e-mail ou WhatsApp válido.');
            }
        }

        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                executarBusca();
            }
        });

        // Inicialização
        renderizarHistoricoUI();
        renderizarOfertas('Xbox Series X');
    </script>
</body>
</html>
