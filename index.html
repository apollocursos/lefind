<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le.Find - Motor de Comparação de Preços</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0F172A;
            color: #FFFFFF;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 { color: #60A5FA; }
        .search-box {
            margin: 20px 0;
        }
        input {
            padding: 12px;
            width: 60%;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #1E293B;
            color: #FFF;
            font-size: 1rem;
        }
        button {
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            background: #3B82F6;
            color: #FFF;
            font-weight: bold;
            cursor: pointer;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
            text-align: left;
        }
        .card {
            background: #1E293B;
            border: 1px solid #334155;
            padding: 16px;
            border-radius: 10px;
        }
        .price {
            color: #34D399;
            font-size: 1.2rem;
            font-weight: bold;
            margin: 10px 0;
        }
        .btn-buy {
            display: block;
            background: #2563EB;
            color: #FFF;
            text-align: center;
            padding: 8px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Le.Find</h1>
    <p>O seu agregador inteligente de novos e usados.</p>

    <div class="search-box">
        <input type="text" id="termo" placeholder="O que procura hoje?">
        <button onclick="pesquisar()">Pesquisar</button>
    </div>

    <div id="resultados" class="grid">
        <div class="card">
            <h3>iPhone 15 Pro Max</h3>
            <div class="price">R$ 6.899,00</div>
            <a href="#" class="btn-buy">Ver Oferta</a>
        </div>
        <div class="card">
            <h3>Tênis Nike Air Force (Seminovo)</h3>
            <div class="price">R$ 280,00</div>
            <a href="#" class="btn-buy">Ver Oferta</a>
        </div>
    </div>

    <script>
        function pesquisar() {
            const query = document.getElementById('termo').value;
            alert("A pesquisar por: " + query);
        }
    </script>

</body>
</html>
