<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LE.FIND - Agregador Global Inteligente</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #070b19 0%, #0b132b 100%);
            color: #f8fafc;
            margin: 0;
            min-height: 100vh;
            padding: 30px 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(28, 37, 65, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 15px 25px;
            border-radius: 14px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .badge {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }
        h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
        }
        .search-card {
            background: rgba(28, 37, 65, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 20px 25px;
            border-radius: 14px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            margin-bottom: 25px;
        }
        .search-box {
            display: flex;
            gap: 12px;
        }
        input[type="text"] {
            flex: 1;
            padding: 14px 20px;
            font-size: 16px;
            background: rgba(11, 19, 43, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 10px;
            outline: none;
            transition: all 0.2s ease;
        }
        input[type="text"]:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
        input[type="text"]::placeholder {
            color: #64748b;
        }
        button {
            padding: 0 30px;
            font-size: 16px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        button:hover {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
        }
        #resultados-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }
        .card {
            background: rgba(28, 37, 65, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, border-color 0.2s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }
        .card:hover {
            transform: translateY(-3px);
            border-color: rgba(59, 130, 246, 0.4);
        }
        .card-header {
            font-size: 11px;
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            padding: 4px 8px;
            border-radius: 6px;
            display: inline-block;
            margin-bottom: 10px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .card-img-box {
            width: 100%;
            height: 160px;
            background: #ffffff;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 14px;
            padding: 10px;
        }
        .card-img-box img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
            mix-blend-mode: multiply;
        }
        .card-title {
            font-size: 14px;
            font-weight: 500;
            margin: 0 0 14px 0;
            color: #e2e8f0;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 40px;
        }
        .card-price {
            font-size: 20px;
            font-weight: 700;
            color: #4ade80;
            margin-bottom: 12px;
        }
        .btn-oferta {
            display: block;
            text-align: center;
            background: #2563eb;
            color: white;
            padding: 10px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s;
        }
        .btn-oferta:hover {
            background: #1d4ed8;
        }
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px;
            color: #94a3b8;
            background: rgba(28, 37, 65, 0.4);
            border-radius: 14px;
            border: 1px dashed rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo-area">
                <h1>LE.FIND</h1>
                <span class="badge">v3.0 API Real</span>
            </div>
            <div style="font-size: 13px; color: #94a3b8;">Buscador Global Inteligente</div>
        </header>

        <div class="search-card">
            <div class="search-box">
                <input type="text" id="termo-busca" placeholder="O que procuras hoje? (Ex: Celular, Calculadora HP, Tênis...)" onkeypress="handleKeyPress(event)">
                <button onclick="executarBusca()">Pesquisar</button>
            </div>
        </div>

        <div id="resultados-container">
            <div class="empty-state">
                Digite um termo acima para iniciar a varredura inteligente de preços.
            </div>
        </div>
    </div>

    <script>
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                executarBusca();
            }
        }

        async function executarBusca() {
            const termo = document.getElementById('termo-busca').value;
            const container = document.getElementById('resultados-container');

            if (!termo.trim()) {
                alert('Digite um termo para pesquisar.');
                return;
            }

            container.innerHTML = '<div class="empty-state">A pesquisar ofertas nas lojas em tempo real...</div>';

            try {
                const response = await fetch(`/api/search?q=${encodeURIComponent(termo)}`);
                const data = await response.json();

                if (!data.sucesso || !data.ofertas || data.ofertas.length === 0) {
                    container.innerHTML = '<div class="empty-state">Nenhum produto encontrado. Tenta outro termo.</div>';
                    return;
                }

                container.innerHTML = '';

                data.ofertas.forEach(oferta => {
                    const card = document.createElement('div');
                    card.className = 'card';

                    card.innerHTML = `
                        <div>
                            <div class="card-header">${oferta.loja}</div>
                            <div class="card-img-box">
                                ${oferta.imagem ? `<img src="${oferta.imagem}" alt="${oferta.titulo}">` : '<span style="color: #64748b; font-size: 13px;">Sem imagem</span>'}
                            </div>
                            <div class="card-title">${oferta.titulo}</div>
                        </div>
                        <div>
                            <div class="card-price">
                                ${oferta.preco > 0 ? `R$ ${oferta.preco.toFixed(2).replace('.', ',')}` : 'Preço sob consulta'}
                            </div>
                            <a href="${oferta.link}" target="_blank" class="btn-oferta">Ver Oferta</a>
                        </div>
                    `;

                    container.appendChild(card);
                });

            } catch (err) {
                console.error('Erro na requisição:', err);
                container.innerHTML = '<div class="empty-state" style="color: #f87171;">Erro ao carregar os dados das lojas.</div>';
            }
        }
    </script>
</body>
</html>
