<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le.Find - Motor de comparação de preços e ofertas globais</title>
    <meta name="google-site-verification" content="C6zvBK7Uc4u-2kfo9SMO16AM4ZnawdpJmzie1EbztWM" />
    <meta name="lomadee" content="2324685" />

    <!-- CONFIGURAÇÕES PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Le.Find" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- ESTILOS DOS FILTROS HÍBRIDOS (Novos + Usados) -->
    <style>
        .lefind-filters {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .filter-btn {
            background-color: #1E293B;
            color: #FFFFFF;
            border: 1px solid #334155;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .filter-btn.active, .filter-btn:hover {
            background-color: #3B82F6;
            border-color: #60A5FA;
        }
    </style>
</head>
<body>

    <!-- SECÇÃO DE FILTROS HÍBRIDOS RáPIDOS -->
    <div class="lefind-filters">
        <button class="filter-btn active" onclick="filtrarProdutos('all', this)">🔍 Todos os Mercados</button>
        <button class="filter-btn" onclick="filtrarProdutos('new', this)">✨ Só Novos (Lojas)</button>
        <button class="filter-btn" onclick="filtrarProdutos('used', this)">♻️ Só Usados / Garimpo</button>
        <button class="filter-btn" onclick="filtrarProdutos('viral', this)">🔥 Achados de Redes Sociais</button>
    </div>

    <script>
        // Função de controlo dos filtros híbridos para milhões de utilizadores na interface
        function filtrarProdutos(tipo, elemento) {
            // Remove a classe ativa de todos os botões
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            // Adiciona ao botão clicado
            elemento.classList.add('active');
            
            console.log("Filtro aplicado:", tipo);
            // Aqui entra a lógica de renderização dinâmica ligada às APIs configuradas
        }
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('Trabalhador de serviço registrado:', reg))
                    .catch(err => console.log('Erro no Trabalhador de Serviços:', err));
            });
        }
    </script>
</body>
</html>
