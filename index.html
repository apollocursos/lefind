<script>
        // Base de dados simulada para testes e expansão com APIs
        const baseProdutos = [
            { title: "Smartphone Apple iPhone 15 Pro Max 256GB", price: "R$ 6.899,00", condition: "new", tagText: "Novo (Lojas)", tagClass: "tag-new", url: "#" },
            { title: "Ténis Nike Air Force 1 Original Seminovo", price: "R$ 280,00", condition: "used", tagText: "Usado / Garimpo", tagClass: "tag-used", url: "#" },
            { title: "Cadeira de Escritório Presidente Ergonómica", price: "R$ 749,90", condition: "new", tagText: "Novo (Lojas)", tagClass: "tag-new", url: "#" },
            { title: "Consola PlayStation 5 Com 2 comandos (Pouco uso)", price: "R$ 3.200,00", condition: "used", tagText: "Usado / Garimpo", tagClass: "tag-used", url: "#" }
        ];

        let filtroAtual = 'all';

        function renderizarProdutos(filtro = 'all', termoBusca = '') {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';

            const termoNormalizado = termoBusca.toLowerCase().trim();

            const filtrados = baseProdutos.filter(produto => {
                // Filtro por condição (all, new, used)
                const passaFiltroCondicao = (filtro === 'all') || (produto.condition === filtro);
                
                // Filtro por termo de pesquisa (título do produto)
                const passaBusca = termoNormalizado === '' || produto.title.toLowerCase().includes(termoNormalizado);

                return passaFiltroCondicao && passaBusca;
            });

            if (filtrados.length === 0) {
                grid.innerHTML = '<p style="color: #94A3B8; grid-column: 1/-1; text-align:center;">Nenhum produto encontrado para esta busca.</p>';
                return;
            }

            filtrados.forEach(produto => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div>
                        <span class="product-tag ${produto.tagClass}">${produto.tagText}</span>
                        <div class="product-title">${produto.title}</div>
                        <div class="product-price">${produto.price}</div>
                    </div>
                    <a href="${produto.url}" target="_blank" class="buy-btn">Ver Oferta</a>
                `;
                grid.appendChild(card);
            });
        }

        function filtrarProdutos(tipo, elemento) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            elemento.classList.add('active');
            filtroAtual = tipo;
            
            const termo = document.getElementById('searchInput').value;
            renderizarProdutos(filtroAtual, termo);
        }

        function executarBusca() {
            const termo = document.getElementById('searchInput').value;
            renderizarProdutos(filtroAtual, termo);
        }

        // Permite pesquisar ao pressionar a tecla "Enter" na barra de pesquisa
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                executarBusca();
            }
        });

        // Renderiza a lista inicial ao carregar a página
        window.onload = () => {
            renderizarProdutos('all', '');
        };
    </script>
