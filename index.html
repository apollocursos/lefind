<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LE.FIND - Agregador Global de Ofertas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: #111827;
            --card-border: #1f2937;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-yellow: #f59e0b;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .main-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            padding: 30px 20px 20px 20px;
            background-color: transparent;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            text-align: center;
        }

        .brand-title {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--accent-blue);
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* BARRA DE PESQUISA REPOSTA */
        .search-box {
            display: flex;
            gap: 10px;
            justify-content: center;
            width: 100%;
            max-width: 600px;
        }

        .search-input {
            flex-grow: 1;
            padding: 12px 18px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            background-color: var(--card-bg);
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent-blue);
        }

        .search-btn {
            background-color: var(--accent-blue);
            color: #FFFFFF;
            border: none;
            padding: 0 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .search-btn:hover {
            background-color: #2563eb;
        }

        .trends-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .trends-title {
            color: var(--text-muted);
            font-weight: 600;
        }

        .trend-chips {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .chip {
            background-color: var(--card-bg);
            color: var(--text-main);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid var(--card-border);
        }

        .chip:hover {
            background-color: var(--accent-blue);
            border-color: var(--accent-blue);
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-btn {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .filter-btn:hover, .filter-btn.active {
            border-color: var(--accent-blue);
            background-color: rgba(59, 130, 246, 0.1);
        }

        .stats-banner {
            margin: 10px 20px 20px 20px;
            background-color: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 12px 20px;
            border-radius: 10px;
            text-align: center;
            font-size: 0.95rem;
            color: #93c5fd;
        }

        .results-grid {
            padding: 0 20px 40px 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
        }

        .offer-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
            transition: transform 0.2s, border-color 0.2s;
        }

        .offer-card:hover {
            border-color: var(--text-muted);
            transform: translateY(-2px);
        }

        .offer-card.best-deal {
            border-color: var(--accent-green);
        }

        .best-badge {
            position: absolute;
            top: -10px;
            left: 20px;
            background-color: var(--accent-green);
            color: #000;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 3px 10px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .price-tag {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--text-main);
        }

        .card-tags {
            display: flex;
            gap: 8px;
            font-size: 0.8rem;
        }

        .tag-frete {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--accent-green);
            padding: 3px 8px;
            border-radius: 4px;
        }

        .tag-rating {
            background-color: rgba(245, 158, 11, 0.1);
            color: var(--accent-yellow);
            padding: 3px 8px;
            border-radius: 4px;
        }

        .platform-info {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .history-box {
            background-color: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }

        .trend-down {
            color: var(--accent-green);
            font-weight: 500;
        }

        .card-actions {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        .btn-offer {
            flex-grow: 2;
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            transition: background 0.2s;
        }

        .btn-offer:hover {
            background-color: #2563eb;
        }

        .btn-alert {
            flex-grow: 1;
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-alert:hover {
            background-color: var(--card-border);
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <header>
            <div class="brand-title">
                <i class="fa-solid fa-cube"></i> LE.FIND
            </div>
            
            <!-- CAIXA DE PESQUISA COM BOTÃO -->
            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" placeholder="O que deseja procurar? (Ex: Xbox, Air Fryer, iPhone...)">
                <button class="search-btn" onclick="executarBusca()">Buscar</button>
            </div>

            <div class="trends-bar">
                <span class="trends-title">Tendências:</span>
                <div class="trend-chips">
                    <button class="chip" onclick="buscarTermo('Chupeta Infantil')">Chupeta Infantil</button>
                    <button class="chip" onclick="buscarTermo('Air Fryer')">Air Fryer</button>
                    <button class="chip" onclick="buscarTermo('Xbox Series X')">Xbox Series X</button>
                    <button class="chip" onclick="buscarTermo('iPhone 15')">iPhone 15</button>
                </div>
            </div>

            <div class="filter-buttons">
                <button class="filter-btn active" onclick="filtrar('todos')"><i class="fa-solid fa-globe"></i> Todos</button>
                <button class="filter-btn" onclick="filtrar('oficiais')"><i class="fa-solid fa-shield-halved"></i> Lojas Oficiais (Novos)</button>
                <button class="filter-btn" onclick="filtrar('garimpo')"><i class="fa-solid fa-tags"></i> Garimpo (Usados)</button>
            </div>
        </header>

        <div class="stats-banner" id="stats-banner">
            Encontradas 6 lojas. Comparando as melhores ofertas em tempo real.
        </div>

        <div class="results-grid" id="results-grid">
            <!-- Cards injetados via JS -->
        </div>
    </div>

    <script>
        function normalizarTexto(texto) {
            return texto.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        }

        function gerarPrecosDinamicos(termo) {
            const termoLower = normalizarTexto(termo);
            let baseMin = 150;
            let baseMax = 550;

            if (termoLower.includes('xbox series x')) {
                baseMin = 3499.00;
                baseMax = 3899.00;
            } else if (termoLower.includes('xbox series s')) {
                baseMin = 2199.00;
                baseMax = 2499.00;
            } else if (termoLower.includes('xbox')) {
                baseMin = 2199.00;
                baseMax = 2499.00;
            } else if (termoLower.includes('chupeta')) {
                baseMin = 7.99;
                baseMax = 19.99;
            } else if (termoLower.includes('air fryer')) {
                baseMin = 299.00;
                baseMax = 599.00;
            } else if (termoLower.includes('iphone')) {
                baseMin = 4500.00;
                baseMax = 7800.00;
            } else {
                baseMin = 120.00;
                baseMax = 650.00;
            }

            return [
                { store: "Shopee / Lomadee", condition: "new", min: baseMin * 0.95, max: baseMax * 0.95, brand: "Ofertas Diretas", frete: "📦 Frete Grátis", rating: "⭐ 4.9 (4.1k)", best: true },
                { store: "Amazon (Afiliados)", condition: "new", min: baseMin, max: baseMax, brand: "Lojas Oficiais", frete: "📦 Frete Prime", rating: "⭐ 4.8 (2.3k)", best: false },
                { store: "Mercado Livre", condition: "new", min: baseMin * 1.02, max: baseMax * 1.05, brand: "Nacionais & Importadas", frete: "📦 Frete Full", rating: "⭐ 4.7 (1.8k)", best: false },
                { store: "AliExpress / Awin", condition: "new", min: baseMin * 0.90, max: baseMax * 0.90, brand: "Direto da Fábrica", frete: "✈ Envio Internacional", rating: "⭐ 4.6 (950)", best: false },
                { store: "OLX / Enjoei", condition: "used", min: baseMin * 0.60, max: baseMax * 0.70, brand: "Garimpo e Seminovos", frete: "📍 Combinar com Vendedor", rating: "⭐ 4.5 (310)", best: false },
                { store: "eBay / Impact", condition: "new", min: baseMin * 1.10, max: baseMax * 1.15, brand: "Importados Globais", frete: "📦 Envio Global", rating: "⭐ 4.8 (620)", best: false }
            ];
        }

        let termoAtual = "Xbox Series X";

        function renderizarOfertas(termo, filtroTipo = 'todos') {
            termoAtual = termo;
            const ofertas = gerarPrecosDinamicos(termo);
            const grid = document.getElementById('results-grid');
            grid.innerHTML = '';

            let filtradas = ofertas;
            if (filtroTipo === 'oficiais') {
                filtradas = ofertas.filter(o => o.brand === "Lojas Oficiais" || o.brand === "Ofertas Diretas");
            } else if (filtroTipo === 'garimpo') {
                filtradas = ofertas.filter(o => o.condition === "used");
            }

            filtradas.forEach(item => {
                const card = document.createElement('div');
                card.className = `offer-card ${item.best ? 'best-deal' : ''}`;
                
                let badgeHtml = item.best ? `<div class="best-badge"><i class="fa-solid fa-star"></i> Menor Preço Global</div>` : '';
                
                const precoFormatado = `R$ ${item.min.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2})} - R$ ${item.max.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;

                card.innerHTML = `
                    ${badgeHtml}
                    <div class="card-header">
                        <div class="card-title">${termo.toUpperCase()} (${item.brand})</div>
                    </div>
                    <div class="price-tag">${precoFormatado}</div>
                    <div class="card-tags">
                        <span class="tag-frete">${item.frete}</span>
                        <span class="tag-rating">${item.rating}</span>
                    </div>
                    <div class="platform-info">Plataforma: ${item.store}</div>
                    <div class="history-box">
                        <span>Histórico (30d): Tendência</span>
                        <span class="trend-down"><i class="fa-solid fa-arrow-trend-down"></i> Em Queda ↓</span>
                    </div>
                    <div class="card-actions">
                        <a href="#" class="btn-offer">Ver Ofertas</a>
                        <button class="btn-alert"><i class="fa-regular fa-bell"></i> Alerta</button>
                    </div>
                `;
                grid.appendChild(card);
            });

            document.getElementById('stats-banner').innerText = `Encontradas ${filtradas.length} lojas para "${termo}". Comparando as melhores ofertas em tempo real.`;
        }

        function buscarTermo(termo) {
            document.getElementById('searchInput').value = termo;
            renderizarOfertas(termo, 'todos');
        }

        function executarBusca() {
            const input = document.getElementById('searchInput').value.trim();
            if (input) {
                renderizarOfertas(input, 'todos');
            }
        }

        function filtrar(tipo) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            renderizarOfertas(termoAtual, tipo);
        }

        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                executarBusca();
            }
        });

        // Inicializa com Xbox Series X
        renderizarOfertas('Xbox Series X');
    </script>
</body>
</html>
