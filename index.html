<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LE.FIND - Agregador Global Inteligente</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b132b;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1c2541;
            padding: 15px 25px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .badge {
            background: #4361ee;
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        h1 {
            margin: 0;
            font-size: 22px;
            color: #ffffff;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        input[type="text"] {
            flex: 1;
            padding: 14px 20px;
            font-size: 16px;
            background: #1c2541;
            border: 1px solid #3a506b;
            color: white;
            border-radius: 8px;
            outline: none;
        }
        input[type="text"]::placeholder {
            color: #8d99ae;
        }
        button {
            padding: 0 30px;
            font-size: 16px;
            background-color: #3a86ff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2667cc;
        }
        #resultados-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }
        .card {
            background: #1c2541;
            border: 1px solid #3a506b;
            border-radius: 10px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .card-header {
            font-size: 13px;
            background: #0b132b;
            color: #4cc9f0;
            padding: 5px 10px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 12px;
            font-weight: bold;
        }
        .card-img-box {
            width: 100%;
            height: 180px;
            background: #ffffff;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 15px;
        }
        .card-img-box img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
        }
        .card-title {
            font-size: 15px;
            margin: 0 0 15px 0;
            color: #e0e1dd;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 42px;
        }
        .card-price {
            font-size: 20px;
            font-weight: bold;
            color: #4ade80;
            margin-bottom: 15px;
        }
        .btn-oferta {
            display: block;
            text-align: center;
            background: #2563eb;
            color: white;
            padding: 12px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn-oferta:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo-area">
                <h1>LE.FIND</h1>
                <span class="badge">v3.0 API Real</span>
            </div>
            <div style="font-size: 13px; color: #8d99ae;">Buscador Global Inteligente</div>
        </header>

        <div class="search-box">
            <input type="text" id="termo-busca" placeholder="O que procuras hoje? (Ex: COPO STANLEY, IPHONE, MOCHILA...)">
            <button onclick="executarBusca()">Buscar</button>
        </div>

        <div id="resultados-container"></div>
    </div>

    <script>
        async function executarBusca() {
            const termo = document.getElementById('termo-busca').value;
            const container = document.getElementById('resultados-container');

            if (!termo.trim()) {
                alert('Digite um termo para pesquisar.');
                return;
            }

            container.innerHTML = '<p style="color: #8d99ae; grid-column: 1/-1; text-align: center; padding: 40px;">A pesquisar produtos reais nas APIs...</p>';

            try {
                // Apanha o endpoint correto correspondente ao ficheiro api/pesquisa.js
                const response = await fetch(`/api/pesquisa?q=${encodeURIComponent(termo)}`);
                const data = await response.json();

                if (!data.sucesso || !data.ofertas || data.ofertas.length === 0) {
                    container.innerHTML = '<p style="color: #8d99ae; grid-column: 1/-1; text-align: center; padding: 40px;">Nenhum produto encontrado.</p>';
                    return;
                }

                container.innerHTML = '';

                data.ofertas.forEach(oferta => {
                    const card = document.createElement('div');
                    card.className = 'card';

                    card.innerHTML = `
                        <div>
                            <div class="card-header">${oferta.loja}</div>
                            <div class="card-img-box">
                                ${oferta.imagem ? `<img src="${oferta.imagem}" alt="${oferta.titulo}">` : '<span style="color: #666; font-size: 12px;">Sem imagem</span>'}
                            </div>
                            <div class="card-title">${oferta.titulo}</div>
                        </div>
                        <div>
                            <div class="card-price">
                                ${oferta.preco > 0 ? `R$ ${oferta.preco.toFixed(2).replace('.', ',')}` : 'Preço sob consulta'}
                            </div>
                            <a href="${oferta.link}" target="_blank" class="btn-oferta">Ver Oferta</a>
                        </div>
                    `;

                    container.appendChild(card);
                });

            } catch (err) {
                console.error('Erro na requisição:', err);
                container.innerHTML = '<p style="color: #ef4444; grid-column: 1/-1; text-align: center; padding: 40px;">Erro ao carregar os dados das lojas.</p>';
            }
        }
    </script>
</body>
</html>
