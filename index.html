<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le.Find - Agregador Global de Ofertas e Afiliados</title>
    <meta name="google-site-verification" content="C6zvBK7Uc4u-2kfo9SMO16AM4ZnawdpJmzie1EbztWM" />
    <meta name="lomadee" content="2324685" />

    <!-- CONFIGURAÇÕES PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Le.Find" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- ESTILOS DO MOTOR HÍBRIDO -->
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0F172A;
            color: #F8FAFC;
            margin: 0;
            padding: 20px;
        }
        .lefind-container {
            max-width: 1000px;
            margin: 0 auto;
            text-align: center;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 5px;
            color: #60A5FA;
        }
        p.subtitle {
            color: #94A3B8;
            margin-bottom: 25px;
        }
        /* Barra de Pesquisa */
        .search-box {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }
        .search-input {
            width: 70%;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid #334155;
            background-color: #1E293B;
            color: #FFFFFF;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-input:focus {
            border-color: #3B82F6;
        }
        .search-btn {
            background-color: #3B82F6;
            color: #FFFFFF;
            border: none;
            padding: 0 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .search-btn:hover {
            background-color: #2563EB;
        }
        /* Filtros */
        .lefind-filters {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .filter-btn {
            background-color: #1E293B;
            color: #CBD5E1;
            border: 1px solid #334155;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }
        .filter-btn.active, .filter-btn:hover {
            background-color: #3B82F6;
            color: #FFFFFF;
            border-color: #60A5FA;
        }
        /* Grelha de Produtos */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            text-align: left;
        }
        .product-card {
            background-color: #1E293B;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s;
        }
        .product-card:hover {
            transform: translateY(-3px);
            border-color: #475569;
        }
        .product-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: #F1F5F9;
        }
        .product-price {
            font-size: 1.25rem;
            font-weight: 700;
            color: #34D399;
            margin-bottom: 12px;
        }
        .product-tag {
            display: inline-block;
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 600;
            margin-bottom: 12px;
            width: fit-content;
        }
        .tag-new { background-color: #065F46; color: #34D399; }
        .tag-used { background-color: #78350F; color: #FBBF24; }
        .tag-multi { background-color: #1E3A8A; color: #93C5FD; }
        
        .buy-btn {
            background-color: #2563EB;
            color: #FFFFFF;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background-color 0.2s;
        }
        .buy-btn:hover { background-color: #1D4ED8; }
    </style>
</head>
<body>

    <div class="lefind-container">
        <h1>Le.Find</h1>
        <p class="subtitle">Agregador Global: Busque em todas as redes de afiliados e usados sem restrições.</p>

        <!-- BARRA DE PESQUISA -->
        <div class="search-box">
            <input type="text" id="searchInput" class="search-input" placeholder="O que deseja procurar em todas as lojas? (Ex: iPhone, Notebook, Tênis...)">
            <button class="search-btn" onclick="executarBuscaGlobal()">Buscar em Tudo</button>
        </div>

        <!-- FILTROS HÍBRIDOS -->
        <div class="lefind-filters">
            <button class="filter-btn active" onclick="filtrarCondicao('all', this)">🔍 Todos</button>
            <button class="filter-btn" onclick="filtrarCondicao('new', this)">✨ Lojas Oficiais (Novos)</button>
            <button class="filter-btn" onclick="filtrarCondicao('used', this)">♻️ Garimpo (Usados)</button>
        </div>

        <!-- GRELHA DE RESULTADOS -->
        <div id="productsGrid" class="products-grid">
            <!-- Os itens iniciais e de busca aparecerão aqui -->
        </div>
    </div>

    <script>
        // Base inicial de ofertas em destaque
        let listaProdutos = [
            { title: "Smartphone Apple iPhone 15 Pro Max 256GB", price: "R$ 6.899,00", condition: "new", store: "Amazon / Mercado Livre", tagClass: "tag-new", url: "https://www.mercadolivre.com.br" },
            { title: "Tênis Nike Air Force 1 Original Seminovo", price: "R$ 280,00", condition: "used", store: "Garimpo Local / OLX", tagClass: "tag-used", url: "https://www.olx.com.br" },
            { title: "Cadeira de Escritório Presidente Ergonômica", price: "R$ 749,90", condition: "new", store: "Shopee / Lomadee", tagClass: "tag-new", url: "https://www.shopee.com.br" },
            { title: "Console PlayStation 5 Com 2 Controles", price: "R$ 3.200,00", condition: "used", store: "Enjoei / Usados", tagClass: "tag-used", url: "https://www.enjoei.com.br" },
            { title: "Smart TV 50 4K UHD LED Wi-Fi", price: "R$ 2.199,00", condition: "new", store: "AliExpress / Awin", tagClass: "tag-new", url: "https://pt.aliexpress.com" }
        ];

        let filtroCondicaoAtual = 'all';

        function renderizar(produtosParaMostrar) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';

            const filtrados = produtosParaMostrar.filter(p => {
                if (filtroCondicaoAtual === 'all') return true;
                return p.condition === filtroCondicaoAtual;
            });

            if (filtrados.length === 0) {
                grid.innerHTML = '<p style="color: #94A3B8; grid-column: 1/-1; text-align:center;">Nenhum produto encontrado com este filtro.</p>';
                return;
            }

            filtrados.forEach(produto => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div>
                        <span class="product-tag ${produto.tagClass}">${produto.store}</span>
                        <div class="product-title">${produto.title}</div>
                        <div class="product-price">${produto.price}</div>
                    </div>
                    <a href="${produto.url}" target="_blank" class="buy-btn">Ver na Loja</a>
                `;
                grid.appendChild(card);
            });
        }

        function executarBuscaGlobal() {
            const termo = document.getElementById('searchInput').value.trim();
            if (!termo) {
                renderizar(listaProdutos);
                return;
            }

            const termoCodificado = encodeURIComponent(termo);

            // Gera automaticamente os links de busca direta para todas as APIs de Afiliados e Usados configuradas
            const resultadosDinamicos = [
                { title: `${termo} - Oferta Oficial em Destaque`, price: "Verificar na Loja", condition: "new", store: "Amazon (Afiliados)", tagClass: "tag-new", url: `https://www.amazon.com.br/s?k=${termoCodificado}` },
                { title: `${termo} - Menor Preço Global`, price: "Verificar na Loja", condition: "new", store: "Mercado Livre", tagClass: "tag-new", url: `https://lista.mercadolivre.com.br/${termoCodificado}` },
                { title: `${termo} com Frete Grátis`, price: "Verificar na Loja", condition: "new", store: "Shopee / Lomadee", tagClass: "tag-new", url: `https://shopee.com.br/search?keyword=${termoCodificado}` },
                { title: `${termo} Importado Direto`, price: "Verificar na Loja", condition: "new", store: "AliExpress / Awin", tagClass: "tag-new", url: `https://pt.aliexpress.com/wholesale?SearchText=${termoCodificado}` },
                { title: `${termo} Garimpo de Usados`, price: "Verificar na Loja", condition: "used", store: "OLX / Enjoei", tagClass: "tag-used", url: `https://www.olx.com.br/brasil?q=${termoCodificado}` },
                { title: `${termo} Internacional Global`, price: "Verificar na Loja", condition: "new", store: "eBay / Impact", tagClass: "tag-multi", url: `https://www.ebay.com/sch/i.html?_nkw=${termoCodificado}` }
            ];

            renderizar(resultadosDinamicos);
        }

        function filtrarCondicao(tipo, elemento) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            elemento.classList.add('active');
            filtroCondicaoAtual = tipo;
            
            const termo = document.getElementById('searchInput').value.trim();
            if (termo) {
                executarBuscaGlobal();
            } else {
                renderizar(listaProdutos);
            }
        }

        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                executarBuscaGlobal();
            }
        });

        window.onload = () => {
            renderizar(listaProdutos);
        };
    </script>
</body>
</html>
